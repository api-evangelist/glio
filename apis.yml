image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/glio.png
name: Glio
description: >-
  Glio is a unified API for AI media generation that provides a single interface
  to 90+ models across video, image, audio, and text from providers such as Kling,
  ByteDance Seedance, Google Veo and Imagen, OpenAI GPT Image, Suno, ElevenLabs,
  Runway, and Anthropic Claude. Developers create work via an asynchronous
  job-based workflow (create job, poll, get result), and also call
  OpenAI-compatible chat-completions and embeddings endpoints synchronously.
  Billing is pay-per-use in GL tokens (1 GL = $0.01 USD) with no subscriptions or
  minimums. Surfaced as an a16z portfolio company and enriched from Glio's public
  developer surface at glio.io / api.glio.io.
